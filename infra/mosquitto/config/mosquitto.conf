# Eclipse Mosquitto 2.x configuration for the inspection robot
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# every client must authenticate; topics restricted by ACL
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# small command/ack messages must not be delayed (KPI: round-trip < 80 ms)
set_tcp_nodelay true

# --- plain MQTT on the LAN (development) -------------------------------------
listener 1883

# --- MQTT over TLS 1.3 (production) --------------------------------------------
# 1. python tools/generate_certs.py --host <server-ip-or-dns>
# 2. uncomment the block below and restart:  docker compose restart mosquitto
# 3. robot: mqtt.port 8883, tls: true, ca_cert: ../infra/certs/ca.crt
#    backend .env: MQTT_PORT=8883 MQTT_TLS=true MQTT_CA_CERT=/certs/ca.crt
#
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# tls_version tlsv1.3
# require_certificate false     # set true for mutual TLS (client certs)
